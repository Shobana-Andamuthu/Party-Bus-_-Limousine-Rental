<!DOCTYPE html>
<html lang="en" data-theme="light" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VELVET | Client Portal Login</title>
  <link rel="icon" type="image/png" href="assets/images/logo.png">
  <link rel="shortcut icon" type="image/png" href="assets/images/logo.png">
  <link rel="apple-touch-icon" href="assets/images/logo.png">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/responsive.css">

  <style>
    .auth-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg-primary);
      padding: 40px 20px;
    }

    .auth-card {
      width: 100%;
      max-width: 440px;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 36px;
      box-shadow: var(--shadow-lg);
    }

    .pwd-wrapper {
      position: relative;
    }

    .pwd-toggle {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="auth-container" style="position: relative;">
    <!-- TOP FLOATING CONTROLS (THEME & RTL TOGGLE) -->
    <div style="position: absolute; top: 20px; right: 24px; display: flex; align-items: center; gap: 10px; z-index: 100;">
      <button class="icon-btn" id="themeToggleBtn" title="Theme Toggle"><i class="fas fa-moon" id="themeIcon"></i></button>
      <button class="icon-btn" id="dirToggleBtn" title="Direction Toggle"><span id="dirText" style="font-size:0.78rem; font-weight:800;">LTR</span></button>
    </div>

    <div class="auth-card">
      <div style="text-align: center; margin-bottom: 28px;">
        <a href="index.html" class="brand-logo" style="justify-content: center; margin-bottom: 10px;">
          <img src="assets/images/logo.png" alt="VELVET Logo" class="brand-logo-img">
          <span>VELVET</span>
        </a>
        <h2 style="font-size: 1.6rem;">Client Portal Login</h2>
        <p style="color: var(--text-muted); font-size: 0.88rem; margin-top: 4px;">Manage vehicle bookings, route stops & invoices.</p>
      </div>

      <form action="dashboard.html" method="GET">
        <div style="margin-bottom: 18px;">
          <label style="font-size: 0.8rem; font-weight: 700; color: var(--text-secondary); text-transform: uppercase; margin-bottom: 6px; display: block;">Email Address</label>
          <input type="email" id="loginEmail" class="form-control" value="jordan.blake@example.com" required>
        </div>

        <div style="margin-bottom: 18px;">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
            <label style="font-size: 0.8rem; font-weight: 700; color: var(--text-secondary); text-transform: uppercase;">Password</label>
            <a href="#" style="font-size: 0.8rem; color: var(--burgundy-primary);">Forgot?</a>
          </div>
          <div class="pwd-wrapper">
            <input type="password" id="loginPwd" class="form-control" value="password123" required>
            <i class="fas fa-eye pwd-toggle" onclick="togglePasswordVisibility()"></i>
          </div>
        </div>

        <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 24px;">
          <input type="checkbox" id="remember" checked>
          <label for="remember" style="font-size: 0.85rem; color: var(--text-secondary);">Remember me on this browser</label>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; height: 46px; font-size: 1rem;">
          <i class="fas fa-sign-in-alt"></i> Login to Dashboard
        </button>
      </form>

      <div style="text-align: center; margin-top: 24px; font-size: 0.88rem; color: var(--text-muted);">
        Don't have an account? <a href="register.html" style="color: var(--burgundy-primary); font-weight: 700;">Create Account</a>
      </div>

      <div style="text-align: center; margin-top: 16px;">
        <a href="index.html" style="font-size: 0.82rem; color: var(--text-muted);"><i class="fas fa-arrow-left"></i> Back to Homepage</a>
      </div>
    </div>
  </div>

  <script src="assets/js/main.js"></script>
  <script>
    function togglePasswordVisibility() {
      const pwdInput = document.getElementById('loginPwd');
      const icon = document.querySelector('.pwd-toggle');
      if (pwdInput.type === 'password') {
        pwdInput.type = 'text';
        icon.className = 'fas fa-eye-slash pwd-toggle';
      } else {
        pwdInput.type = 'password';
        icon.className = 'fas fa-eye pwd-toggle';
      }
    }
  </script>
</body>
</html>
