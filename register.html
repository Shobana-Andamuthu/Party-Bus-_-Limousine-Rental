<!DOCTYPE html>
<html lang="en" data-theme="light" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VELVET | Create Client Account</title>
  <link rel="icon" type="image/png" href="assets/images/logo.png">
  <link rel="shortcut icon" type="image/png" href="assets/images/logo.png">
  <link rel="apple-touch-icon" href="assets/images/logo.png">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/responsive.css">

  <style>
    .auth-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg-primary);
      padding: 40px 20px;
    }

    .auth-card {
      width: 100%;
      max-width: 480px;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 36px;
      box-shadow: var(--shadow-lg);
    }
  </style>
</head>
<body>

  <div class="auth-container" style="position: relative;">
    <!-- TOP FLOATING CONTROLS (THEME & RTL TOGGLE) -->
    <div style="position: absolute; top: 20px; right: 24px; display: flex; align-items: center; gap: 10px; z-index: 100;">
      <button class="icon-btn" id="themeToggleBtn" title="Theme Toggle"><i class="fas fa-moon" id="themeIcon"></i></button>
      <button class="icon-btn" id="dirToggleBtn" title="Direction Toggle"><span id="dirText" style="font-size:0.78rem; font-weight:800;">LTR</span></button>
    </div>

    <div class="auth-card">
      <div style="text-align: center; margin-bottom: 24px;">
        <a href="index.html" class="brand-logo" style="justify-content: center; margin-bottom: 10px;">
          <img src="assets/images/logo.png" alt="VELVET Logo" class="brand-logo-img">
          <span>VELVET</span>
        </a>
        <h2 style="font-size: 1.6rem;">Create Client Account</h2>
        <p style="color: var(--text-muted); font-size: 0.88rem; margin-top: 4px;">Join Velvet Client Rewards & track reservations.</p>
      </div>

      <form action="dashboard.html" method="GET">
        <div style="margin-bottom: 14px;">
          <label style="font-size: 0.8rem; font-weight: 700; color: var(--text-secondary); text-transform: uppercase; margin-bottom: 6px; display: block;">Full Name</label>
          <input type="text" class="form-control" placeholder="Jordan Blake" required>
        </div>

        <div style="margin-bottom: 14px;">
          <label style="font-size: 0.8rem; font-weight: 700; color: var(--text-secondary); text-transform: uppercase; margin-bottom: 6px; display: block;">Email Address</label>
          <input type="email" class="form-control" placeholder="jordan@example.com" required>
        </div>

        <div style="margin-bottom: 14px;">
          <label style="font-size: 0.8rem; font-weight: 700; color: var(--text-secondary); text-transform: uppercase; margin-bottom: 6px; display: block;">Phone Number</label>
          <input type="tel" class="form-control" placeholder="(555) 000-0000" required>
        </div>

        <div style="margin-bottom: 18px;">
          <label style="font-size: 0.8rem; font-weight: 700; color: var(--text-secondary); text-transform: uppercase; margin-bottom: 6px; display: block;">Password</label>
          <input type="password" class="form-control" placeholder="Create a secure password" required>
        </div>

        <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 24px;">
          <input type="checkbox" id="terms" required checked>
          <label for="terms" style="font-size: 0.82rem; color: var(--text-secondary);">I agree to the Terms of Service & Privacy Policy</label>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; height: 46px; font-size: 1rem;">
          <i class="fas fa-user-plus"></i> Create Account
        </button>
      </form>

      <div style="text-align: center; margin-top: 24px; font-size: 0.88rem; color: var(--text-muted);">
        Already have an account? <a href="login.html" style="color: var(--burgundy-primary); font-weight: 700;">Login here</a>
      </div>
    </div>
  </div>

  <script src="assets/js/main.js"></script>
</body>
</html>
